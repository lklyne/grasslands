[package]
name = "app"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Every grammar but SQL, whose crate pins `cc ~1.2` against gpui's `cc 1.8`.
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
anyhow = "1.0.104"
notify = "8.2.0"
async-channel = "2.5.0"
herdr-client = { path = "../herdr-client" }
git2 = "0.21.0"
ignore = "0.4.33"
log = "0.4.34"

[dev-dependencies]
# GPUI's own test support, not gpui-kit's: the Kit's `test-support` names
# gpui-fast weakly, and Cargo still resolves it, which pins versions that
# conflict with gpui-pre's. Keep in step with the gpui-pre that gpui-kit pins.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
