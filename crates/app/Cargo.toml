[package]
name = "app"
version = "0.1.5"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The executable name is the macOS menu bar name when run unbundled.
[[bin]]
name = "grasslands"
path = "src/main.rs"

[dependencies]
# All grammars. `tree-sitter-sequel` (SQL) pins `cc ~1.2.1`, so Cargo.lock
# keeps cc at 1.2.x; see docs/decisions/0003-editor.md.
gpui-kit = { version = "0.7.3", features = ["tree-sitter-languages"] }
anyhow = "1.0.104"
notify = "8.2.0"
async-channel = "2.5.0"
herdr-client = { path = "../herdr-client" }
cues = { path = "../cues" }
ignore = "0.4.33"
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
trash = "5.2.9"
gpui-libghostty = "0.3.1"
serde_json = "1.0.154"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSObjCRuntime", "NSDate", "NSData"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile", "NSSound", "NSWindow", "NSView", "NSColor", "NSGraphics", "NSEvent", "NSGraphicsContext", "NSImage"] }

[dev-dependencies]
serde_json = "1.0.154"
# GPUI's own test support, not gpui-kit's: the Kit's `test-support` names
# gpui-fast weakly, and Cargo still resolves it, which pins versions that
# conflict with gpui-pre's. Keep in step with the gpui-pre that gpui-kit pins.
gpui-pre = { version = "=0.3.9", features = ["test-support"] }
