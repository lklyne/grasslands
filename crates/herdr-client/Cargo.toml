[package]
name = "herdr-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "herdr socket API client: connection, server start, typed commands, events and a self-healing session cache"

[dependencies]
async-channel = "2.5.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
