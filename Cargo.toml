[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

# Per-terminal Ghostty config files; see docs/decisions/0001-ghostty-gpui-kit.md.
[patch.crates-io]
gpui-libghostty = { path = "vendor/gpui-libghostty" }
gpui-component = { path = "vendor/gpui-component" }

# Synthesis runs per play; unoptimized it takes ~50 ms, optimized ~4 ms. See docs/decisions/0017-cues.md.
[profile.dev.package.cues]
opt-level = 3
