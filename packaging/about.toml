# cargo-about config for the release bundle's THIRD-PARTY-NOTICES.txt
# (scripts/bundle.sh). All of these are permissive; MPL-2.0 is file-level
# copyleft and only asks that the notice ship with the binary.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Skip this workspace's own unpublished crates.
private = { ignore = true }

# Only what ships in the binary: dev-dependencies (test-only crates such as
# jsonschema for the herdr schema conformance tests) aren't distributed.
ignore-dev-dependencies = true

# Its Cargo.toml has only license-file; the file is MIT.
[tree-sitter-graphql.clarify]
license = "MIT"
[[tree-sitter-graphql.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "5ea7d9ec06cb21ca0a800b69cd954e346bafba94620eb115c4b1fead3f3b30f8"
